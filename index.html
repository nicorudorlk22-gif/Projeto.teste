<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b18">
  <title>NEXUS AI — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #070b18;
      --panel: #0b1224;
      --panel-2: #0e1830;
      --panel-3: #101e3b;
      --line: rgba(92, 154, 255, .17);
      --line-strong: rgba(69, 162, 255, .38);
      --text: #eef4ff;
      --muted: #8493b4;
      --dim: #536384;
      --blue: #259fff;
      --cyan: #18d9f2;
      --purple: #7952ff;
      --green: #16d8a0;
      --radius: 16px;
      --sidebar: 250px;
      font-family: "DM Sans", sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 75% -18%, rgba(31, 80, 200, .19), transparent 37%),
        radial-gradient(ellipse at 12% 100%, rgba(64, 20, 150, .11), transparent 34%),
        var(--bg);
      font-size: 14px;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; }
    .sidebar {
      position: fixed; z-index: 20; inset: 0 auto 0 0; width: var(--sidebar);
      display: flex; flex-direction: column; padding: 22px 14px 14px;
      background: rgba(7, 12, 27, .94); border-right: 1px solid var(--line);
      backdrop-filter: blur(20px);
    }
    .brand { display:flex; align-items:center; gap:11px; padding: 0 9px 23px; }
    .brand-mark {
      width: 35px; height: 35px; display:grid; place-items:center; border-radius: 11px;
      color:#fff; font-family:"Space Grotesk"; font-weight:700; font-size:18px;
      background: linear-gradient(135deg, #21d6ff, #5b48ff 55%, #be31ff);
      box-shadow: 0 0 22px rgba(66, 99, 255, .42);
      transform: skew(-5deg);
    }
    .brand-name { font:700 17px "Space Grotesk", sans-serif; letter-spacing:.035em; }
    .brand-name span { color:#b246ff; }
    .workspace-switch {
      width:100%; display:flex; align-items:center; gap:10px; text-align:left;
      padding:10px; margin-bottom:18px; border:1px solid var(--line); border-radius:12px;
      background:rgba(15, 26, 51, .8); cursor:pointer; transition:.2s;
    }
    .workspace-switch:hover { border-color:var(--line-strong); background:var(--panel-2); }
    .workspace-icon { display:grid; place-items:center; width:29px;height:29px;border-radius:9px;background:#20266a;color:#9d90ff; }
    .workspace-copy { flex:1; min-width:0; }
    .workspace-copy b { display:block;font-size:12px; }
    .workspace-copy small { display:block;color:var(--muted);font-size:10px;margin-top:2px; }
    .nav-label { color:#607092; font:500 10px "DM Mono",monospace; text-transform:uppercase; letter-spacing:.12em; padding:8px 11px; }
    .nav-list { display:grid; gap:3px; }
    .nav-item {
      border:0; background:transparent; width:100%; min-height:39px; display:flex; align-items:center; gap:11px;
      padding:0 11px; color:#9aa9c7; border-radius:10px; cursor:pointer; text-align:left; transition:.18s;
    }
    .nav-item .icon { width:17px; height:17px; display:grid; place-items:center; }
    .nav-item svg { width:16px;height:16px; stroke-width:1.8; }
    .nav-item:hover { color:#eef4ff; background:rgba(33, 69, 130, .24); }
    .nav-item.active { color:white; background:linear-gradient(90deg,rgba(34, 123, 255, .2),rgba(113, 70, 255, .13)); box-shadow:inset 2px 0 #36aaff; }
    .nav-item.active svg { color:#55bcff; }
    .nav-badge { margin-left:auto; font:10px "DM Mono"; color:#94a6c7; }
    .sidebar-spacer { flex:1; }
    .upgrade-card {
      padding:13px; border:1px solid rgba(117, 75, 255, .25); border-radius:13px;
      background:linear-gradient(140deg,rgba(55, 39, 125, .28),rgba(12, 23, 46, .85)); margin-bottom:12px;
    }
    .upgrade-card .spark { color:#ae8aff; display:flex; align-items:center; gap:7px; font-size:12px;font-weight:600; }
    .upgrade-card p { color:#8e9cba;font-size:11px;line-height:1.5;margin:8px 0 11px; }
    .upgrade-card button { width:100%; padding:8px;border:0;border-radius:8px;background:linear-gradient(100deg,#6357ff,#a53af4);font-size:11px;font-weight:600;cursor:pointer; }
    .user-profile { display:flex;align-items:center;gap:10px;padding:11px 8px 3px;border-top:1px solid var(--line); }
    .avatar { width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f0a16b,#8d48ff);font-size:12px;font-weight:700;color:white; }
    .user-meta { flex:1; }.user-meta b { display:block;font-size:12px; }.user-meta small { color:var(--muted);font-size:10px; }
    .main { margin-left:var(--sidebar); min-height:100vh; }
    .topbar {
      height:68px; display:flex;align-items:center;gap:16px;padding:0 34px;
      border-bottom:1px solid rgba(83, 132, 216, .12); background:rgba(7, 11, 24, .52);
      position:sticky;top:0;z-index:10;backdrop-filter:blur(18px);
    }
    .mobile-menu { display:none; border:0;background:none;color:var(--text);padding:5px;cursor:pointer; }
    .crumb { color:var(--muted);font-size:12px;display:flex;align-items:center;gap:9px; }
    .crumb strong { color:#e4ecff;font-weight:500; }
    .top-search { margin-left:auto; width:min(270px,29vw);position:relative; }
    .top-search input {
      width:100%;height:35px;border-radius:9px;border:1px solid var(--line);background:rgba(13, 23, 44, .8);
      padding:0 32px 0 34px;color:var(--text);outline:none;font-size:12px;
    }
    .top-search input:focus { border-color:#358fe6;box-shadow:0 0 0 3px rgba(30, 133, 255,.1); }
    .top-search svg { position:absolute;left:11px;top:10px;width:15px;height:15px;color:#8191b2; }
    .search-shortcut { position:absolute;right:9px;top:9px;font:10px "DM Mono";color:#5f7093; }
    .top-icon { width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:rgba(13,23,44,.75);color:#9baaca;cursor:pointer;position:relative; }
    .top-icon:hover { color:white;border-color:var(--line-strong); }
    .notify-dot { width:6px;height:6px;background:#a450ff;border-radius:50%;position:absolute;right:7px;top:6px; }
    .content { max-width:1450px;margin:0 auto;padding:30px 34px 50px; }
    .page-heading { display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px; }
    .eyebrow { display:flex;align-items:center;gap:7px;color:#68bdff;font:10px "DM Mono";text-transform:uppercase;letter-spacing:.13em;margin-bottom:8px; }
    .eyebrow .pulse { width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green); }
    h1,h2,h3,p { margin-top:0; }
    h1 { font:600 clamp(23px,2.2vw,31px) "Space Grotesk",sans-serif;letter-spacing:-.04em;margin-bottom:6px; }
    .subheading { color:var(--muted);margin:0;font-size:13px; }
    .heading-actions { display:flex;gap:9px;align-items:center; }
    .btn {
      border:1px solid var(--line-strong);border-radius:9px;background:rgba(14,28,54,.8);color:#dce9ff;
      height:36px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
      font-size:11px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap;
    }
    .btn:hover { border-color:#43b3ff;transform:translateY(-1px);background:#12294d; }
    .btn svg { width:15px;height:15px; }
    .btn-primary { border-color:transparent;background:linear-gradient(105deg,#2567ff,#853cff);box-shadow:0 4px 20px rgba(89,63,255,.22);color:white; }
    .btn-primary:hover { background:linear-gradient(105deg,#3883ff,#9b50ff); }
    .btn-quiet { background:transparent;border-color:var(--line);color:#a7b6d3; }
    .grid { display:grid;gap:15px; }
    .stats-grid { grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px; }
    .card {
      border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(14,25,48,.94),rgba(9,16,32,.97));
      box-shadow:0 10px 35px rgba(0,0,0,.08);
    }
    .stat-card { padding:16px 17px;min-height:105px;position:relative;overflow:hidden; }
    .stat-card:after { content:"";position:absolute;right:-25px;top:-38px;width:100px;height:100px;border-radius:50%;background:rgba(44,130,255,.08);filter:blur(16px); }
    .stat-label { color:var(--muted);font-size:11px;display:flex;align-items:center;gap:7px; }
    .stat-label svg { width:14px;height:14px;color:#60b8ff; }
    .stat-value { font:600 23px "Space Grotesk";margin-top:11px;letter-spacing:-.04em; }
    .stat-change { color:#58d9b2;font-size:10px;margin-left:7px;font-family:"DM Sans";letter-spacing:0; }
    .stat-foot { color:#687a9c;font-size:10px;margin-top:4px; }
    .overview-grid { display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.92fr);gap:15px;align-items:start; }
    .chat-card { overflow:hidden; }
    .card-head { padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(89,139,219,.12); }
    .card-title { display:flex;align-items:center;gap:10px; }
    .card-title h2 { font:600 14px "Space Grotesk";margin:0; }
    .card-title p { color:var(--muted);font-size:10px;margin:4px 0 0; }
    .model-pill { display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);color:#c2d0ec;background:#0b1830;font-size:10px;cursor:pointer; }
    .model-pill .gem { width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#12cfff,#6b52ff);color:white;font-size:10px; }
    .chat-intro { min-height:216px;padding:22px 20px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center; }
    .orb {
      width:54px;height:54px;border-radius:18px;display:grid;place-items:center;margin:1px auto 13px;
      color:#a5efff;background:radial-gradient(circle at 35% 25%,#379eff,#4930ba 60%,#211259);
      box-shadow:0 0 28px rgba(46,120,255,.4),inset 0 0 15px rgba(53,226,255,.25);transform:rotate(-9deg);
    }
    .orb svg { width:26px;height:26px; }
    .chat-intro h3 { font:500 17px "Space Grotesk";margin:0 0 6px; }
    .chat-intro p { max-width:410px;color:var(--muted);font-size:11px;line-height:1.6;margin:0; }
    .suggestions { display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:15px; }
    .suggestion { border:1px solid var(--line);border-radius:20px;background:rgba(19,33,65,.67);padding:7px 10px;color:#aebcda;font-size:10px;cursor:pointer; }
    .suggestion:hover { border-color:#488bff;color:white; }
    .conversation { max-height:250px;overflow-y:auto;padding:0 18px; }
    .message { max-width:84%;padding:10px 12px;margin:10px 0;border-radius:12px;font-size:11px;line-height:1.55; }
    .message.user { margin-left:auto;background:linear-gradient(115deg,#174da9,#4d3bad);border:1px solid rgba(112,144,255,.3); }
    .message.ai { background:#101d38;border:1px solid var(--line);color:#d5e1fa; }
    .message-meta { display:flex;gap:6px;align-items:center;color:#8b9abb;font-size:9px;margin-bottom:5px; }
    .composer-wrap { padding:12px 15px 15px; }
    .composer {
      border:1px solid rgba(81,150,255,.31);border-radius:12px;background:#091329;padding:9px 10px 8px;
      transition:.2s;
    }
    .composer:focus-within { border-color:#388fea;box-shadow:0 0 0 3px rgba(49,135,255,.08); }
    .composer textarea { display:block;width:100%;min-height:35px;max-height:110px;resize:vertical;border:0;outline:0;background:transparent;color:#e9f1ff;font-size:11px;padding:4px; }
    .composer textarea::placeholder { color:#66799e; }
    .composer-tools { display:flex;align-items:center;gap:6px; }
    .tool-button { display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:#8797b7;cursor:pointer; }
    .tool-button:hover { background:#15264a;color:white; }
    .tool-button svg { width:15px;height:15px; }
    .composer-hint { color:#657596;font-size:9px;margin-left:4px; }
    .send-button { margin-left:auto;width:31px;height:31px;border:0;border-radius:9px;background:linear-gradient(135deg,#286eff,#9039f5);display:grid;place-items:center;cursor:pointer;color:white; }
    .send-button:hover { filter:brightness(1.2); }
    .send-button svg { width:16px;height:16px; }
    .right-stack { display:grid;gap:15px; }
    .model-summary { padding:16px; }
    .summary-title { display:flex;align-items:center;justify-content:space-between;margin-bottom:15px; }
    .summary-title h2 { font:600 13px "Space Grotesk";margin:0; }
    .text-link { color:#68baff;background:none;border:0;font-size:10px;cursor:pointer;padding:3px; }
    .text-link:hover { color:white; }
    .active-model { display:flex;align-items:center;gap:11px;padding:12px;border-radius:11px;border:1px solid rgba(48,158,255,.27);background:linear-gradient(110deg,rgba(20,69,131,.26),rgba(34,28,96,.21)); }
    .model-icon { width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#38c7ff,#5738fc);font-size:20px;box-shadow:0 0 15px rgba(37,134,255,.19); }
    .active-model-info { flex:1; }
    .active-model-info b { display:block;font-size:11px; }
    .active-model-info small { color:var(--muted);font-size:10px; }
    .status { display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:20px;color:#49e4b4;background:rgba(8,158,112,.15);font-size:9px; }
    .status:before { content:"";width:5px;height:5px;background:#28dfa8;border-radius:50%; }
    .usage-row { margin-top:15px;display:flex;justify-content:space-between;color:#99a9c7;font-size:10px; }
    .progress { height:5px;border-radius:8px;background:#162440;margin-top:8px;overflow:hidden; }
    .progress span { display:block;height:100%;width:38%;border-radius:8px;background:linear-gradient(90deg,#18d8f0,#7351ff); }
    .agent-card { padding:15px; }
    .agent-list { display:grid;gap:8px; }
    .agent-row { display:flex;align-items:center;gap:9px;padding:8px;border:1px solid rgba(81,131,205,.14);border-radius:10px;background:rgba(12,25,49,.6); }
    .agent-icon { width:31px;height:31px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:rgba(32,127,242,.18);color:#68c8ff; }
    .agent-row:nth-child(2) .agent-icon { color:#b89bff;background:rgba(111,65,230,.2); }
    .agent-row:nth-child(3) .agent-icon { color:#4de0cc;background:rgba(19,173,163,.16); }
    .agent-info { flex:1;min-width:0; }
    .agent-info b { display:block;font-size:10px; }
    .agent-info small { color:var(--muted);font-size:9px; }
    .agent-count { font:10px "DM Mono";color:#8a9bbb; }
    .lower-grid { display:grid;grid-template-columns:1.1fr 1fr .88fr;gap:15px;margin-top:15px; }
    .compact-card { padding:16px;min-height:166px; }
    .project-list { display:grid;gap:8px;margin-top:13px; }
    .project-row { display:flex;align-items:center;gap:10px; }
    .project-thumb { width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#145b94,#4c42bd);font-size:14px; }
    .project-row:nth-child(2) .project-thumb { background:linear-gradient(135deg,#ae4d29,#662b84); }
    .project-row:nth-child(3) .project-thumb { background:linear-gradient(135deg,#157b78,#2355bc); }
    .project-meta { flex:1; }
    .project-meta b { font-size:10px;display:block; }
    .project-meta small { color:var(--muted);font-size:9px; }
    .project-time { color:#68799b;font-size:9px; }
    .activity-list { margin-top:15px;display:grid;gap:12px; }
    .activity-item { display:flex;gap:9px;align-items:flex-start;color:#a8b5d0;font-size:10px;line-height:1.4; }
    .activity-dot { margin-top:4px;width:7px;height:7px;border-radius:50%;background:#2ad6b0;box-shadow:0 0 8px rgba(42,214,176,.5);flex:0 0 auto; }
    .activity-item:nth-child(2) .activity-dot { background:#9c62ff;box-shadow:0 0 8px #864cff; }
    .activity-item:nth-child(3) .activity-dot { background:#36a9ff; }
    .activity-item small { display:block;color:#68799c;font-size:9px;margin-top:3px; }
    .quick-actions { display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px; }
    .quick-action { display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:9px;background:rgba(12,25,49,.7);color:#b6c5e1;font-size:10px;cursor:pointer; }
    .quick-action:hover { border-color:var(--line-strong);color:white;background:#102246; }
    .quick-action svg { width:15px;height:15px;color:#64c4ff; }
    /* Dynamic page components */
    .toolbar { display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0; }
    .filter-chip { border:1px solid var(--line);border-radius:20px;background:#0b162e;color:#9baaca;padding:7px 12px;font-size:10px;cursor:pointer; }
    .filter-chip.active,.filter-chip:hover { color:white;border-color:#655aff;background:rgba(101,80,255,.23); }
    .inline-search { position:relative;flex:1;min-width:180px;max-width:330px; }
    .inline-search svg { width:15px;position:absolute;left:11px;top:10px;color:#8092b5; }
    .inline-search input { width:100%;height:36px;padding:0 10px 0 33px;background:#0b162e;border:1px solid var(--line);border-radius:9px;color:var(--text);outline:0;font-size:11px; }
    .inline-search input:focus { border-color:#388fea; }
    .data-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px; }
    .data-card { padding:15px;transition:.2s; }
    .data-card:hover { border-color:rgba(75,159,255,.38);transform:translateY(-2px); }
    .data-card-top { display:flex;align-items:center;gap:10px; }
    .data-card h3 { font:600 13px "Space Grotesk";margin:0 0 4px; }
    .data-card p { color:var(--muted);font-size:10px;line-height:1.5;margin:12px 0; }
    .data-card .mini-meta { color:#7183a5;font-size:9px; }
    .data-card-actions { display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid rgba(89,139,219,.12); }
    .tag { font-size:9px;color:#79caff;background:rgba(33,131,222,.13);border:1px solid rgba(53,161,255,.17);padding:4px 7px;border-radius:20px; }
    .terminal-window { border:1px solid rgba(64,147,255,.25);border-radius:13px;background:#050a16;overflow:hidden; }
    .terminal-bar { height:38px;display:flex;align-items:center;gap:6px;padding:0 13px;background:#0d1830;border-bottom:1px solid var(--line); }
    .term-dot { width:7px;height:7px;border-radius:50%;background:#ff667b; }.term-dot:nth-child(2){background:#f4bd55}.term-dot:nth-child(3){background:#35d6a2}
    .terminal-title { color:#8b9bb9;font:10px "DM Mono";margin-left:6px; }
    .terminal-output { min-height:280px;padding:17px;color:#a9c6df;font:11px/1.9 "DM Mono"; }
    .terminal-output .green { color:#27d6a2; }.terminal-output .cyan { color:#43caff; }.terminal-output .purple { color:#ad80ff; }
    .terminal-input-wrap { display:flex;gap:9px;border-top:1px solid var(--line);padding:11px; }
    .terminal-input-wrap input { flex:1;background:transparent;border:0;outline:0;color:#c8f5e5;font:11px "DM Mono"; }
    .setting-row { display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid rgba(89,139,219,.12); }
    .setting-row:last-child { border-bottom:0; }
    .setting-row b { display:block;font-size:12px; }.setting-row small { color:var(--muted);font-size:10px;display:block;margin-top:4px; }
    .toggle { width:37px;height:21px;border-radius:20px;background:#253451;border:0;padding:3px;cursor:pointer;transition:.2s;flex:0 0 auto; }
    .toggle:after { content:"";display:block;width:15px;height:15px;border-radius:50%;background:#8b9ab7;transition:.2s; }
    .toggle.on { background:#3a47b9; }.toggle.on:after { transform:translateX(16px);background:white; }
    .empty-state { grid-column:1/-1;padding:45px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px; }
    .empty-state svg { color:#6487c4;margin-bottom:8px; }
    .split-layout { display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.7fr);gap:15px; }
    .voice-panel { text-align:center;padding:40px 20px; }

      else if(action==="api-keys")showModal("Cofre de API Keys",`<p style="font-size:11px;color:var(--muted);line-height:1.6">Suas chaves são criptografadas e armazenadas com segurança. Adicione uma chave para habilitar seu provedor.</p><div class="field"><label>Provedor</label><select><option>Google Gemini</option><option>OpenAI</option><option>Anthropic</option><option>OpenRouter</option><option>Hugging Face</option></select></div><div class="field"><label>API Key</label><input type="password" placeholder="sk-••••••••••••••••"></div>`,"Salvar chave");
      else if(action==="compare")showModal("Comparar modelos",`<div class="field"><label>Modelo 1</label><select><option>Gemini 2.5 Pro</option><option>DeepSeek R1</option></select></div><div class="field"><label>Modelo 2</label><select><option>Claude 3.7 Sonnet</option><option>GPT-4.1</option></select></div><p style="color:var(--muted);font-size:10px">Compare qualidade, velocidade, contexto e custo lado a lado.</p>`,"Iniciar comparação");
      else if(action==="new-agent")showModal("Criar agente personalizado",`<div class="field"><label>Nome do agente</label><input placeholder="Ex.: Product Designer"></div><div class="field"><label>Instruções e especialidade</label><textarea placeholder="Descreva o papel e como o agente deve trabalhar..."></textarea></div><div class="field"><label>Modelo padrão</label><select><option>Automático</option><option>Gemini 2.5 Pro</option><option>Claude 3.7 Sonnet</option></select></div>`,"Criar agente");
      else if(action==="agent-detail")showModal(e.target.closest("[data-agent]").dataset.agent,`<p style="color:var(--muted);font-size:12px;line-height:1.7">Este agente está ativo e pronto para colaborar com seus projetos. Ele pode receber tarefas diretamente ou ser acionado pelo Main Agent.</p><div class="setting-row"><div><b>Compartilhamento de contexto</b><small>Usar informações do projeto atual</small></div><button class="toggle on" data-toggle></button></div>`,"Iniciar tarefa");
      else if(action==="routing"||action==="model-settings")showModal("Configurações de modelos",`<div class="field"><label>Estratégia de roteamento</label><select><option>Melhor qualidade</option><option>Mais rápido</option><option>Menor custo</option></select></div><div class="field"><label>Temperatura</label><input type="range" min="0" max="2" step=".1" value=".7"></div><div class="setting-row"><div><b>Fallback automático</b><small>Trocar para outro modelo se houver falha.</small></div><button class="toggle on" data-toggle></button></div>`,"Salvar preferências");
      else if(action==="publish-plugin"||action==="add-integration")showModal(action==="publish-plugin"?"Publicar extensão":"Adicionar integração",`<div class="field"><label>Nome</label><input placeholder="Nome da ferramenta"></div><div class="field"><label>URL ou identificador</label><input placeholder="https://..."></div><div class="field"><label>Descrição</label><textarea placeholder="O que esta integração permite fazer?"></textarea></div>`,"Continuar");
      else if(action==="save-settings")toast("Preferências salvas com segurança.");
      else if(action==="upgrade")showModal("NEXUS PRO",`<p style="color:var(--muted);line-height:1.7;font-size:12px">Desbloqueie limites maiores, modelos premium, mais sandboxes e colaboração avançada entre agentes.</p><div class="active-model"><div class="model-icon">✦</div><div class="active-model-info"><b>Plano Pro</b><small>Mais possibilidades para suas ideias</small></div><span class="tag">Em breve</span></div>`,"Avisar quando disponível");
      else if(action==="profile"||action==="edit-profile")showModal("Seu perfil",`<div class="field"><label>Nome</label><input value="Beli"></div><div class="field"><label>E-mail</label><input value="beli@nexus.ai"></div>`,"Salvar perfil");
      else if(action==="task-queue")showModal("Fila de tarefas",`<div class="activity-list"><div class="activity-item"><span class="activity-dot"></span><div><b>Gerar estrutura inicial do projeto</b><small>Coding Agent · Em execução</small></div></div><div class="activity-item"><span class="activity-dot"></span><div><b>Verificar dependências</b><small>Security Agent · Na fila</small></div></div></div>`,"Fechar");
      else if(action==="activity"||action==="chat-history")showModal("Histórico recente",`<div class="activity-list"><div class="activity-item"><span class="activity-dot"></span><div><b>Como criar uma interface React moderna?</b><small>Hoje, 10:42 · Gemini 2.5 Pro</small></div></div><div class="activity-item"><span class="activity-dot"></span><div><b>Revisão de segurança do projeto</b><small>Ontem, 16:21 · Security Agent</small></div></div><div class="activity-item"><span class="activity-dot"></span><div><b>Planejamento do Website Nexus</b><small>Ontem, 11:05 · Main Agent</small></div></div></div>`,"Ver conversas");
      else if(action==="browser-refresh")toast("Página atualizada.");
      else if(action==="browser-new")toast("Nova aba criada.");
      else if(action==="browser-history")toast("Histórico de navegação aberto.");
      else if(action==="browser-tool")toast("Ferramenta do navegador ativada.");
      else if(action==="github")toast("Conecte o GitHub em Integrações para abrir este repositório.");
      else if(action==="open-dashboard")toast("Dashboard do projeto aberto.");
      else if(action==="security")toast("Suas configurações de segurança estão atualizadas.");
      else if(action==="select-model")toast("Modelo selecionado.");
    });
    view.addEventListener("submit",e=>{
      if(e.target.id==="chat-form"){e.preventDefault();sendMessage(document.getElementById("chat-input").value);}
      if(e.target.id==="terminal-form"){e.preventDefault();const input=document.getElementById("terminal-command"),cmd=input.value.trim();if(!cmd)return;const out=document.getElementById("terminal-output");out.insertAdjacentHTML("beforeend",`<div><span class="green">nexus@sandbox</span>:<span class="cyan">~/my-app</span>$ ${escapeHtml(cmd)}</div><div>${terminalResponse(cmd)}</div>`);input.value="";out.scrollTop=out.scrollHeight;}
    });
    function terminalResponse(cmd){const c=cmd.toLowerCase();if(c==="ls")return `<span class="cyan">src/</span> &nbsp; package.json &nbsp; README.md &nbsp; vite.config.js`;if(c==="pwd")return "/workspace/my-app";if(c.startsWith("npm run dev"))return `<span class="green">VITE v5.2.1</span> ready in 320ms<br>➜ Local: <span class="cyan">http://localhost:3000/</span>`;if(c==="git status")return "On branch main<br>nothing to commit, working tree clean";if(c.startsWith("cd"))return "Diretório atualizado.";if(c==="clear")return "";return `Comando executado no sandbox: <span class="green">${escapeHtml(cmd)}</span>`;}
    view.addEventListener("input",e=>{
      if(e.target.id==="catalog-search")filterModels();
      if(e.target.id==="agent-search"){let q=e.target.value.toLowerCase();document.querySelectorAll(".agent-card-item").forEach(x=>x.style.display=x.dataset.name.includes(q)?"":"none");}
      if(e.target.id==="project-search"){let q=e.target.value.toLowerCase();document.querySelectorAll(".project-card").forEach(x=>x.style.display=x.dataset.name.includes(q)?"":"none");}
      if(e.target.id==="plugin-search"){let q=e.target.value.toLowerCase();let filter=document.querySelector("[data-plugin-filter].active")?.dataset.pluginFilter||"Todos";let data=plugins.filter(p=>(filter==="Todos"||p[3]===filter)&&p.join(" ").toLowerCase().includes(q));document.getElementById("plugin-grid").innerHTML=pluginCards(data);lucide.createIcons();}
      if(e.target.id==="integration-search"){let q=e.target.value.toLowerCase();document.querySelectorAll(".integration-card").forEach(x=>x.style.display=x.dataset.name.includes(q)?"":"none");}
    });
    function filterModels(){
      const q=document.getElementById("catalog-search")?.value.toLowerCase()||"";
      let items=models.filter(m=>(m.name+" "+m.provider+" "+m.type).toLowerCase().includes(q));
      if(currentFilter==="Grátis")items=items.filter(x=>x.price==="Grátis");
      if(currentFilter==="Pagos")items=items.filter(x=>x.price==="Pago");
      if(currentFilter==="Locais")items=items.filter(x=>x.type==="Local"||x.type==="Open source");
      if(currentFilter==="Favoritos")items=items.filter(x=>document.querySelector(`.model-card[data-name*="${x.name.toLowerCase()}"] .favorite-btn`)?.classList.contains("favorited"));
      document.getElementById("model-grid").innerHTML=modelCards(items);lucide.createIcons();
    }
    document.getElementById("global-search").addEventListener("keydown",e=>{
      if(e.key==="Enter"){const q=e.target.value.trim();if(q){render("Modelos de IA");setTimeout(()=>{const i=document.getElementById("catalog-search");if(i){i.value=q;filterModels();}},0);}}
    });
    document.addEventListener("keydown",e=>{
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("global-search").focus();}
      if(e.key==="Escape"){document.getElementById("modal-root").innerHTML="";document.body.classList.remove("nav-open");}
    });
    document.getElementById("modal-root").addEventListener("click",e=>{
      if(e.target.closest("[data-close-modal]"))document.getElementById("modal-root").innerHTML="";
      if(e.target.closest("[data-modal-submit]")){const name=document.getElementById("new-project-name");if(name&&!name.value.trim()){name.focus();name.style.borderColor="#ff5f7c";return;}const title=document.querySelector(".modal-head h2")?.textContent||"Concluído";document.getElementById("modal-root").innerHTML="";toast(title.includes("projeto")?"Projeto criado com sucesso.":title.includes("chave")?"Credencial salva com segurança.":"Alterações salvas com sucesso.");}
    });
    view.addEventListener("click",e=>{
      if(e.target.closest("#browser-go")){const url=document.getElementById("browser-url").value;document.querySelector("#browser-preview p").textContent=`Página carregada: ${url}`;toast("Navegação concluída.");}
      if(e.target.closest("#voice-toggle")){const orb=document.getElementById("voice-orb");orb.classList.toggle("listening");const active=orb.classList.contains("listening");document.getElementById("voice-label").textContent=active?"Estou ouvindo...":"Toque para falar";document.getElementById("voice-sub").textContent=active?"Fale naturalmente com seu agente.":"Reconhecimento de voz em tempo real, pronto para você.";e.target.closest("#voice-toggle").innerHTML=active?`${icon("mic-off")} Pausar microfone`:`${icon("mic")} Iniciar conversa`;lucide.createIcons();}
      const chip=e.target.closest(".command-chip");if(chip){const input=document.getElementById("terminal-command");if(input){input.value=chip.dataset.command;input.focus();}}
    });
    render("Início");
  </script>
</body>
</html>
